[project]
name = "assayhq"
version = "0.0.1"
description = "Execution-grounded security verifier for AI agent skills"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
assay = "assay.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "assay"
