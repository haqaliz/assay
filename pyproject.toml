[project]
name = "assayhq"
version = "0.1.0"
description = "Execution-grounded security verifier for AI agent skills"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ali Haqiqi" }]
keywords = ["ai-agents", "security", "sandbox", "agent-skills", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = ["pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/haqaliz/assay"
Repository = "https://github.com/haqaliz/assay"
Issues = "https://github.com/haqaliz/assay/issues"
Changelog = "https://github.com/haqaliz/assay/blob/master/CHANGELOG.md"

[project.scripts]
assay = "assay.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "assay"
